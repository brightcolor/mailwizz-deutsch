name: Veröffentlichung

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Prüfen
        run: |
          test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
          php tests/run.php
          php tools/build.php --check
          php tools/check.php
      - name: Paket bauen
        run: |
          mkdir -p dist
          zip -rq dist/mailwizz-deutsch.zip deutsch
          cp translations/manifest.json translations/de_de.json dist/
          awk -v v="$(cat VERSION)" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > dist/notes.md
      - name: Veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/mailwizz-deutsch.zip dist/manifest.json dist/de_de.json \
            --title "$GITHUB_REF_NAME" --notes-file dist/notes.md
